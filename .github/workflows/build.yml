name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch VST3 SDK
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git third_party/vst3sdk
      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -S . -B out -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          else
            cmake -S . -B out -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build
        run: cmake --build out --config Release --target DrumForge
      - name: Collect
        shell: bash
        run: find out -maxdepth 4 -name "*.vst3*" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: DrumForge-${{ matrix.os }}
          path: |
            out/bundle
            out/raw
            out/Release
